name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${build_date}"

          targets=(
            "darwin arm64 Darwin_arm64"
            "darwin amd64 Darwin_x86_64"
            "linux arm64 Linux_arm64"
            "linux amd64 Linux_x86_64"
          )

          mkdir -p dist
          for target in "${targets[@]}"; do
            read -r goos goarch label <<< "${target}"
            stage="dist/assistant_${label}"
            mkdir -p "${stage}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" \
              -o "${stage}/assistant" ./cmd/assistant

            cp README.md LICENSE CHANGELOG.md "${stage}/"
            tar -C "${stage}" -czf "dist/assistant_${VERSION}_${label}.tar.gz" .
          done

          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "Assistant ${GITHUB_REF_NAME}"
